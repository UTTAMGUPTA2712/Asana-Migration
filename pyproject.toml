[project]
name = "asana-migration"
version = "0.1.0"
description = "Slow, resumable, rate-limit-safe exporter of an Asana account (teams/projects/sections/tasks/subtasks/comments/collaborators) to a browsable local JSON folder tree, with a local web UI."
readme = "README.md"
authors = [
    { name = "Uttam Gupta", email = "uttam.1128@zenmonk.tech" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "flask>=3.0.0",
]

[project.scripts]
asana-migration = "asana_migration.main:main"
serve = "asana_migration.main:serve_main"
import-all = "asana_migration.main:import_all_main"
download-attachments = "asana_migration.main:download_attachments_main"
retry-all = "asana_migration.main:retry_all_main"
estimate-storage = "asana_migration.main:estimate_storage_main"
padmasana-migration = "padmasana_migration.main:main"
padmasana-map-users = "padmasana_migration.main:map_users_main"
padmasana-import-users = "padmasana_migration.main:import_users_main"
padmasana-build-teams-and-boards = "padmasana_migration.main:build_teams_and_boards_main"
padmasana-upload-attachments = "padmasana_migration.main:upload_attachments_main"
padmasana-build-tasks = "padmasana_migration.main:build_tasks_main"
padmasana-format-docs = "padmasana_migration.main:format_docs_main"
padmasana-inspect-task = "padmasana_migration.main:inspect_task_main"
job-status = "asana_migration.main:job_status_main"


[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
